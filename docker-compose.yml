networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  db_data:
  grafana_data:

services:
  # ================= DATABASE (MYSQL) =================
  db:
    image: mysql:8.0
    container_name: wordpress_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend-net

  # ================= DATABASE MANAGEMENT (PHPMYADMIN) =================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wordpress_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      PMA_ABSOLUTE_URI: https://localhost/phpmyadmin/
    depends_on:
      - db
    networks:
      - frontend-net
      - backend-net

  # ================= WEB APPLICATION (WORDPRESS) =================
  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://localhost');
        define('WP_SITEURL', 'https://localhost');
        define('FORCE_SSL_ADMIN', true);
        $$_SERVER['HTTPS'] = 'on';
    depends_on:
      - db
    networks:
      - frontend-net
      - backend-net

  # ================= REVERSE PROXY & SSL (NGINX) =================
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - wordpress
      - phpmyadmin
    networks:
      - frontend-net

  # ================= MONITORING (CADVISOR - CONTAINERS) =================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor_metrics
    restart: always
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - frontend-net

  # ================= MONITORING (MYSQLD EXPORTER - DATABASE) =================
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysql_exporter
    restart: always
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - "--mysqld.address=db:3306"
      - "--mysqld.username=${MYSQL_USER}"
    depends_on:
      - db
    networks:
      - backend-net
      - frontend-net

  # ================= MONITORING (NGINX PROMETHEUS EXPORTER - WEBSERVER) =================
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    restart: always
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    depends_on:
      - nginx
    networks:
      - frontend-net

  # ================= MONITORING (PROMETHEUS) =================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_monitoring
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - frontend-net

  # ================= VISUALIZATION (GRAFANA) =================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    networks:
      - frontend-net

  # ================= LOGGING (LOKI) =================
  loki:
    image: grafana/loki:latest
    container_name: loki_logger
    restart: always
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - frontend-net

  # ================= LOG AGENT (PROMTAIL) =================
  promtail:
    image: grafana/promtail:latest
    container_name: promtail_agent
    restart: always
    volumes:
      - ./nginx/logs:/var/log/nginx:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
      - nginx
    networks:
      - frontend-net